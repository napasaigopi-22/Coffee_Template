<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Cafe</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="site-header">
        <a class="brand" href="{{ url_for('index') }}" aria-label="Python Cafe home">
            <img src="{{ url_for('static', filename='logo.svg') }}" alt="" class="brand-logo">
            <span>
                <strong>Python Cafe</strong>
                <small>Fresh code, fresh coffee</small>
            </span>
        </a>
        <nav class="main-nav" aria-label="Main navigation">
            <a href="{{ url_for('index') }}">Order</a>
            <a href="{{ url_for('about') }}">About Us</a>
            <a href="{{ url_for('orders') }}">Orders</a>
        </nav>
    </header>

    <main class="page">
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="messages">
                    {% for message in messages %}
                        <p>{{ message }}</p>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </main>
</body>
</html>
